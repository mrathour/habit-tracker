# Weekly dependency updates. Minor and patch updates are grouped per ecosystem to keep the
# number of pull requests down; major updates arrive one per pull request.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps(python)
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps(ui)
    groups:
      ui-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript below 6.1 (PLAN.md Decisions log, 2026-10-18).
      # Remove this once it supports TypeScript 7.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Node's type definitions follow the Node.js runtime in .node-version (24 LTS); raise both
      # together when the project moves to a newer LTS (PLAN.md Decisions log, 2026-10-25).
      - dependency-name: "@types/node"
        versions: [">=25"]

  - package-ecosystem: npm
    directory: /service
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps(service)
    groups:
      service-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Same TypeScript pin as ui/ (PLAN.md Decisions log, 2026-10-18).
      - dependency-name: typescript
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps(ci)
    groups:
      actions:
        patterns: ["*"]
